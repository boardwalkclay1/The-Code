<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>THE CODE — Terminal Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- make sure this path matches your CSS file location -->
  <link rel="stylesheet" href="css/index.css" />

  <meta name="theme-color" content="#000000" />
</head>

<body>

  <!-- MATRIX RAIN BACKGROUND -->
  <canvas id="matrix-canvas"></canvas>

  <!-- MATRIX LOADING SCREEN -->
  <div id="loading-screen" class="hidden"></div>

  <!-- TERMINAL GATEWAY -->
  <div id="terminal-shell">
    <div class="terminal-window">

      <div class="terminal-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="terminal-title">THE CODE / MATRIX EXIT TERMINAL</div>
      </div>

      <div class="terminal-body" id="terminal-output"></div>

      <div class="prompt-line">
        <span class="prompt-label" id="prompt-label">></span>
        <input id="terminal-input" type="text" autocomplete="off" />
        <span class="cursor"></span>
      </div>

    </div>
  </div>

  <!-- TERMINAL LOGIC -->
  <script src="app/lessons/terminal/js/terminal-landing.js"></script>

  <!-- MATRIX RAIN -->
  <script src="modules/matrix.js"></script>

</body>
</html>
