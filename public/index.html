<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>THE CODE — Terminal Landing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="/css/index.css" />

  <meta name="theme-color" content="#000000" />
</head>

<body>

  <!-- MATRIX BACKDROP -->
  <canvas id="matrix-canvas"></canvas>

  <!-- LOADING SCREEN -->
  <div id="loading-screen" class="hidden"></div>

  <!-- TERMINAL SHELL -->
  <div id="terminal-shell">
    <div class="terminal-window">

      <!-- HEADER WITH DOTS -->
      <div class="terminal-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="terminal-title">THE CODE / TERMINAL LANDING</div>
      </div>

      <!-- TERMINAL OUTPUT -->
      <div class="terminal-body" id="terminal-output"></div>

      <!-- INPUT LINE -->
      <div class="prompt-line">
        <span class="prompt-label" id="prompt-label">></span>

        <input
          id="terminal-input"
          type="text"
          autocomplete="off"
          style="
            background:#000;
            border:none;
            outline:none;
            box-shadow:none;
            color:#00ff55;
            font-family:'Courier New', monospace;
            font-size:16px;
            padding:0;
            margin:0;
            appearance:none;
          "
        />

        <span class="cursor"></span>
      </div>

    </div>
  </div>

  <!-- LANDING TERMINAL LOGIC -->
  <script type="module" src="/app/lessons/terminal/js/terminal-landing.js"></script>

  <!-- MATRIX RAIN ENGINE -->

</body>
</html>
