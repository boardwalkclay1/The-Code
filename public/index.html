<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Code — Matrix Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary stylesheet -->
  <link rel="stylesheet" href="css/index.css" />

  <!-- Favicon and app icons -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/icon-512.png" />
  <link rel="mask-icon" href="/assets/img/icon-512.png" color="#00ff41" />

  <!-- PWA manifest and theme -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#001a00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="msapplication-TileColor" content="#001a00" />

  <style>
    /* GLOBAL BACKGROUND — faint image behind everything */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      background: #000;
      background-image:
        linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.82)),
        url('assets/img/code-index.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #00ff41;
      font-family: "Courier New", monospace;
    }

    /* MATRIX CANVAS ABOVE BACKGROUND */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: transparent !important;
    }

    /* APP ABOVE CANVAS */
    #app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* REMOVE INLINE PSEUDO BACKGROUND */
    #app::before { display: none !important; }

    /* FORCE SIDEBAR TO BE PURE BLACK */
    #sidebar {
      background: #000 !important;
      border-right: 1px solid rgba(0,255,65,0.18) !important;
      color: #00ff41 !important;
      backdrop-filter: blur(6px) brightness(0.55) !important;
    }
  </style>
</head>

<body>

  <!-- MATRIX BACKGROUND -->
  <canvas id="matrix-canvas"></canvas>

  <!-- LOADING SCREEN -->
  <div id="loading-screen"></div>

  <!-- MAIN APP -->
  <div id="app" style="display:none;">

    <!-- SIDEBAR -->
    <aside id="sidebar"></aside>

    <!-- MAIN CONTENT -->
    <main id="main">

      <header id="main-header"></header>

      <div id="quick-access"></div>

      <section id="intro-section"></section>

      <section id="lessons-section"></section>

      <section id="simulators-section"></section>

      <section id="microcontrollers-section"></section>

      <section id="gain-section"></section>

      <footer id="footer"></footer>

    </main>
  </div>

  <!-- GLOBAL LOGIC -->
  <script src="assets/js/index.js"></script>

  <!-- MODULE LOGIC -->
  <script src="modules/matrix.js"></script>
  <script src="modules/loading.js"></script>
  <script src="modules/sidebar.js"></script>
  <script src="modules/sections.js"></script>

  <!-- Service worker registration (optional; safe to keep) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('Service worker registered:', reg.scope);
          })
          .catch(err => {
            console.warn('Service worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
