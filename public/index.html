<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Code — Matrix Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/index.css" />

  <style>
    /* Make the page background a faint image so it sits behind the falling code canvas.
       The matrix canvas remains fully visible and draws on top of this faint image. */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      background-color: #000;
      /* dark overlay + faint image */
      background-image:
        linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.82)),
        url('assets/img/code-index.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #00ff41;
      font-family: "Courier New", monospace;
    }

    /* Make the faint image less intrusive while keeping it behind the canvas */
    /* If you want it even fainter, reduce the alpha in the linear-gradient above. */

    /* Ensure the matrix canvas draws above the page background */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0; /* above the body background image */
      background: transparent !important;
    }

    /* App UI sits above the canvas */
    #app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* Loading screen above everything while active */
    #loading-screen { z-index: 20; }

    /* Small safety: keep any inline app pseudo-elements behind the canvas */
    #app::before { display: none; }
  </style>
</head>

<body>

  <!-- MATRIX BACKGROUND (canvas remains the drawing surface for falling code) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- LOADING SCREEN -->
  <div id="loading-screen"></div>

  <!-- MAIN APP -->
  <div id="app" style="display:none;">

    <!-- SIDEBAR -->
    <aside id="sidebar"></aside>

    <!-- MAIN CONTENT -->
    <main id="main">

      <header id="main-header"></header>

      <div id="quick-access"></div>

      <section id="intro-section"></section>

      <section id="lessons-section"></section>

      <section id="simulators-section"></section>

      <section id="microcontrollers-section"></section>

      <section id="gain-section"></section>

      <footer id="footer"></footer>

    </main>
  </div>

  <!-- GLOBAL LOGIC -->
  <script src="assets/js/index.js"></script>

  <!-- MODULE LOGIC -->
  <script src="modules/matrix.js"></script>
  <script src="modules/loading.js"></script>
  <script src="modules/sidebar.js"></script>
  <script src="modules/sections.js"></script>

</body>
</html>
