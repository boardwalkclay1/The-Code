<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>THE CODE — Terminal Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/index.css" />
  <meta name="theme-color" content="#000000" />
</head>

<body>

  <!-- MATRIX RAIN BACKGROUND -->
  <canvas id="matrix-canvas"></canvas>

  <!-- MATRIX LOADING SCREEN -->
  <div id="loading-screen" class="hidden"></div>

  <!-- TERMINAL GATEWAY -->
  <div id="terminal-shell">
    <div class="terminal-window">

      <div class="terminal-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="terminal-title">THE CODE / MATRIX EXIT TERMINAL</div>
      </div>

      <div class="terminal-body" id="terminal-output"></div>

      <div class="prompt-line">
        <span class="prompt-label" id="prompt-label">></span>

        <!-- INPUT FIELD — FORCED BLACK, NO RECTANGLE -->
        <input
          id="terminal-input"
          type="text"
          autocomplete="off"
          style="
            background:#000;
            border:none;
            outline:none;
            box-shadow:none;
            color:#00cc33;
            font-family:'Courier New', monospace;
            font-size:16px;
            padding:0;
            margin:0;
            appearance:none;
          "
        />

        <span class="cursor"></span>
      </div>

    </div>
  </div>

  <!-- MASTER TERMINAL LOGIC -->
  <script src="app/lessons/terminal/js/terminal-master.js"></script>

  <!-- MATRIX RAIN -->
  <script src="modules/matrix.js"></script>

</body>
</html>
