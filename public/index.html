<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Code — Matrix Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA manifest and theme -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#001a00" />
  <link rel="icon" href="assets/img/icon-192.png" sizes="192x192" />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/index.css" />

  <style>
    /* faint background image layer between page background and canvas/UI */
    #app {
      position: relative;
      z-index: 1;
    }

    #app::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2; /* behind app and canvas */
      background-image: url('assets/img/code-index.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0.10;           /* faint — adjust 0.04 to 0.18 as needed */
      filter: blur(1px) saturate(0.9);
      mix-blend-mode: multiply;
      pointer-events: none;
      will-change: opacity, transform;
    }

    /* ensure the matrix canvas is transparent so the image shows through */
    #matrix-canvas {
      background: transparent !important;
      z-index: -1;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* keep the loading screen and app above the canvas */
    #loading-screen { z-index: 20; }
    #app { z-index: 10; }

    /* safety: ensure body remains dark for neon text readability */
    html, body { background: #000; }
  </style>
</head>

<body>

  <!-- MATRIX BACKGROUND (canvas remains the drawing surface for falling code) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- LOADING SCREEN -->
  <div id="loading-screen"></div>

  <!-- MAIN APP -->
  <div id="app" style="display:none;">

    <!-- SIDEBAR -->
    <aside id="sidebar"></aside>

    <!-- MAIN CONTENT -->
    <main id="main">

      <header id="main-header"></header>

      <div id="quick-access"></div>

      <section id="intro-section"></section>

      <section id="lessons-section"></section>

      <section id="simulators-section"></section>

      <section id="microcontrollers-section"></section>

      <section id="gain-section"></section>

      <footer id="footer"></footer>

    </main>
  </div>

  <!-- GLOBAL LOGIC -->
  <script src="assets/js/index.js"></script>

  <!-- MODULE LOGIC -->
  <script src="modules/matrix.js"></script>
  <script src="modules/loading.js"></script>
  <script src="modules/sidebar.js"></script>
  <script src="modules/sections.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('Service worker registered:', reg.scope);
          })
          .catch(err => {
            console.warn('Service worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
