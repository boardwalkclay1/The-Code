<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>THE CODE — Terminal Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#001a00" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #00ff41;
      font-family: "Courier New", monospace;
      height: 100%;
      overflow: hidden;
    }

    /* MATRIX BACKGROUND */
    #matrix-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* TERMINAL SHELL */
    #terminal-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      background: radial-gradient(circle at top, #001100 0, #000 60%);
    }

    .terminal-window {
      max-width: 960px;
      margin: 0 auto;
      height: 100%;
      border: 1px solid #004400;
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 0 25px #00ff41;
      display: flex;
      flex-direction: column;
    }

    .terminal-header {
      padding: 6px 10px;
      border-bottom: 1px solid #004400;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #020;
      font-size: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5555; }
    .dot.yellow { background: #ffdd55; }
    .dot.green { background: #55ff55; }

    .terminal-title {
      margin-left: 10px;
      opacity: 0.8;
    }

    .terminal-body {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .prompt-line {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }

    .prompt-label {
      margin-right: 6px;
    }

    #terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #00ff41;
      font-family: inherit;
      font-size: 14px;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      background: #00ff41;
      margin-left: 2px;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* STATIC FLASH FOR TRANSITION INTO INDEX */
    .static-flash {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,65,0.2),
        rgba(0,255,65,0.2) 2px,
        rgba(0,0,0,0.9) 4px
      );
      mix-blend-mode: screen;
      z-index: 3;
      pointer-events: none;
      animation: staticPulse 0.5s ease-out forwards;
    }

    @keyframes staticPulse {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- MATRIX BACKGROUND -->
  <canvas id="matrix-canvas"></canvas>

  <!-- PURE TERMINAL GATEWAY (NO INDEX CONTENT HERE) -->
  <div id="terminal-shell">
    <div class="terminal-window">

      <div class="terminal-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="terminal-title">THE CODE / MATRIX EXIT TERMINAL</div>
      </div>

      <div class="terminal-body" id="terminal-output"></div>

      <div class="prompt-line">
        <span class="prompt-label" id="prompt-label">></span>
        <input id="terminal-input" autocomplete="off" />
        <span class="cursor"></span>
      </div>

    </div>
  </div>

  <!-- MATRIX RAIN -->
  <script src="modules/matrix.js"></script>

  <!-- MASTER LOGIC: handles gate question, y/n, 404 redirect, index reveal, typing, commands -->
  <script src="/app/lessons/terminal/js/terminal-landing.js"></script>

</body>
</html>
