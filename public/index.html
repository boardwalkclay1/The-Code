<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Code — Matrix Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- keep your external CSS but add a small override to place a faint background image layer -->
  <link rel="stylesheet" href="css/index.css" />

  <style>
    /* --- Image layer sits behind the UI but above the page background.
       This keeps the matrix canvas drawing (falling code) fully visible while the image is faint. */
    #app {
      position: relative; /* ensure pseudo-element positions relative to app */
      z-index: 1;
    }

    /* faint background image layer between page background and canvas/UI */
    #app::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1; /* behind the app content but above the page background */
      background-image: url('assets/img/code-index.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0.12;           /* faint — adjust 0.08 to 0.25 as needed */
      filter: blur(2px) saturate(0.9);
      pointer-events: none;
      will-change: opacity, transform;
    }

    /* ensure the matrix canvas is transparent so the image shows through */
    #matrix-canvas {
      background: transparent !important;
      z-index: 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* keep the loading screen and app above the canvas */
    #loading-screen { z-index: 10; }
    #app { z-index: 1; }

    /* small safety: if your existing CSS sets a background on body, keep it dark so neon text remains readable */
    html, body {
      background: #000;
    }
  </style>
</head>

<body>

  <!-- MATRIX BACKGROUND (canvas remains the drawing surface for falling code) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- LOADING SCREEN -->
  <div id="loading-screen"></div>

  <!-- MAIN APP -->
  <div id="app" style="display:none;">

    <!-- SIDEBAR -->
    <aside id="sidebar"></aside>

    <!-- MAIN CONTENT -->
    <main id="main">

      <header id="main-header"></header>

      <div id="quick-access"></div>

      <section id="intro-section"></section>

      <section id="lessons-section"></section>

      <section id="simulators-section"></section>

      <section id="microcontrollers-section"></section>

      <section id="gain-section"></section>

      <footer id="footer"></footer>

    </main>
  </div>

  <!-- GLOBAL LOGIC -->
  <script src="assets/js/index.js"></script>

  <!-- MODULE LOGIC -->
  <script src="modules/matrix.js"></script>
  <script src="modules/loading.js"></script>
  <script src="modules/sidebar.js"></script>
  <script src="modules/sections.js"></script>

</body>
</html>
