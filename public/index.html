<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>THE CODE — Terminal Gateway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MATRIX + TERMINAL CSS -->
  <link rel="stylesheet" href="/styles/matrix.css" />
  <link rel="stylesheet" href="/app/lessons/terminal/css/terminal.css" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#001a00" />
</head>

<body>

  <!-- MATRIX RAIN BACKGROUND (ALWAYS RUNNING) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- MATRIX LOADING SCREEN (HIDDEN UNTIL JS SHOWS IT) -->
  <div id="loading-screen" class="hidden"></div>

  <!-- TERMINAL GATEWAY (FIRST THING USER SEES) -->
  <div id="terminal-shell">
    <div class="terminal-window">

      <div class="terminal-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="terminal-title">THE CODE / MATRIX EXIT TERMINAL</div>
      </div>

      <div class="terminal-body" id="terminal-output"></div>

      <div class="prompt-line">
        <span class="prompt-label" id="prompt-label">></span>
        <input id="terminal-input" autocomplete="off" />
        <span class="cursor"></span>
      </div>

    </div>
  </div>

  <!-- MATRIX RAIN SCRIPT -->
  <script src="modules/matrix.js"></script>

  <!-- MASTER LOGIC FOR GATEWAY + INDEX REVEAL + COMMANDS -->
  <script src="/app/lessons/terminal/js/terminal-landing.js"></script>

</body>
</html>
